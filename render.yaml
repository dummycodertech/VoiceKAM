services:
  - type: web
    name: voicekam-virtual-kam
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        value: ""
      - key: GROQ_MODELS
        value: openai/gpt-oss-20b,openai/gpt-oss-120b,qwen/qwen3.6-27b,qwen/qwen3.8-27b
      - key: GEMINI_MODELS
        value: gemini-3.5-flash-lite,gemini-3.6-flash
      - key: TTS_PROVIDER
        value: auto
      - key: ALLOW_MOCK_LLM
        value: "false"
      - key: DAILY_TURN_CAP
        value: "400"
      - key: CORS_ORIGINS
        value: "*"
      - key: SESSION_TTL_SECONDS
        value: "7200"
      - key: MAX_SESSIONS
        value: "200"
      - key: MAX_UPLOAD_SKUS
        value: "2000"
      - key: MAX_UPLOAD_BYTES
        value: "1048576"
      - key: MAX_REQUEST_BYTES
        value: "2097152"
      - key: RATE_LIMIT_CHAT_PER_10M
        value: "30"
      - key: RATE_LIMIT_TTS_PER_10M
        value: "120"
      - key: RATE_LIMIT_STT_PER_10M
        value: "30"
      - key: RATE_LIMIT_STARTS_PER_HOUR
        value: "20"

